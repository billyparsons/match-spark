    <style>
      /* packed (session 101). the offer came in. for a hundred sessions   */
      /* every room in this house was laid out to be read the moment you   */
      /* walked in: the words on the wall, nothing between you and them.   */
      /* tonight every room is in a box. the box is a reused one off the   */
      /* back of a liquor store, the old printing crossed out, and the     */
      /* label is in marker, in the hand staging took off the walls. it    */
      /* couldn't write on the paint. nobody said anything about boxes.    */
      /* the room is in there whole. cut the tape and it's yours for the   */
      /* visit; close the tab and the movers tape it back up.              */
      /* contents, so a room laid out as a grid keeps its grid once it's open */
      main > .carton-contents { display: contents; }
      html.packed main > .carton-contents { display: none; }
      .carton-wrap, .carton-flat { grid-column: 1 / -1; }
      .carton-wrap {
        position: relative;
        z-index: 41;
        display: grid;
        justify-items: center;
        gap: 1.1rem;
        padding: 4vh 0 7vh;
        font-family: 'Space Mono', monospace;
      }
      html:not(.packed) .carton-wrap { display: none; }
      .carton {
        --kraft: #B98B57;
        --kraft-dark: #9A6E3F;
        position: relative;
        width: min(31rem, 84vw);
        transform: rotate(var(--lean, -1.2deg));
        filter: drop-shadow(0 18px 14px rgba(40, 30, 18, 0.28));
      }
      /* the top: four flaps shut, seen a little from above */
      .carton-top {
        position: relative;
        height: 4.6rem;
        background:
          linear-gradient(90deg, rgba(0,0,0,0) 49.6%, rgba(70,45,20,0.45) 49.6% 50.4%, rgba(0,0,0,0) 50.4%),
          linear-gradient(180deg, #CFA272, #BE905D);
        clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
      }
      /* the tape, clear brown, down the seam and over the front edge */
      .carton-tape {
        position: absolute;
        left: calc(50% - 1.5rem);
        top: 0;
        width: 3rem;
        height: 7.8rem;
        z-index: 2;
        background: linear-gradient(90deg, rgba(150,100,40,0.55), rgba(196,140,70,0.42) 30%, rgba(225,180,110,0.5) 55%, rgba(150,100,40,0.55));
        box-shadow: inset 0 0 0 1px rgba(120, 80, 30, 0.25);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 88% 97%, 74% 100%, 61% 96%, 47% 100%, 33% 97%, 19% 100%, 7% 96%, 0 100%);
        transition: transform 0.5s ease-in, opacity 0.5s ease-in;
        transform-origin: 50% 0;
      }
      .carton-front {
        position: relative;
        min-height: 15rem;
        padding: 1.4rem 1.6rem 1.3rem;
        background:
          repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 3px, rgba(0,0,0,0.035) 3px 6px),
          radial-gradient(120% 90% at 30% 20%, #C79A66, var(--kraft) 55%, var(--kraft-dark));
        color: #141210;
        overflow: hidden;
      }
      .carton-front::before {
        /* the store it came from, printed in the factory, crossed out by hand */
        content: attr(data-was);
        display: block;
        margin: -0.3rem 0 0.9rem;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-size: clamp(0.8rem, 2.2vw, 1.2rem);
        letter-spacing: 0.12em;
        color: rgba(120, 30, 20, 0.5);
        text-decoration: line-through 3px rgba(20, 18, 16, 0.85);
      }
      .carton-stamp {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.58rem;
        letter-spacing: 0.08em;
        line-height: 1.35;
        color: rgba(50, 32, 14, 0.62);
        border: 1px solid rgba(50, 32, 14, 0.45);
        border-radius: 50%;
        width: 5.4rem;
        height: 5.4rem;
        display: grid;
        place-content: center;
        text-align: center;
        float: right;
        margin: -0.4rem -0.4rem 0.4rem 0.8rem;
        transform: rotate(9deg);
      }
      .carton-label {
        font-family: 'Caveat', 'Comic Sans MS', cursive;
        font-weight: 700;
        color: #141210;
        line-height: 1.02;
        transform: rotate(-2deg);
        transform-origin: 0 0;
      }
      .carton-label .room { display: block; font-size: clamp(2.4rem, 6vw, 3.4rem); letter-spacing: 0.01em; }
      .carton-label .what { display: block; font-size: 1.45rem; font-weight: 600; margin-top: 0.4rem; max-width: 22rem; }
      .carton-label .x { text-decoration: line-through 2px; opacity: 0.85; }
      @media (max-width: 520px) { .carton-stamp { width: 4.2rem; height: 4.2rem; font-size: 0.48rem; } }
      .carton-label .up { display: block; font-size: 1.25rem; margin-top: 0.9rem; }
      .carton-count {
        position: absolute;
        left: 1.6rem;
        bottom: 0.9rem;
        font-family: 'Caveat', cursive;
        font-weight: 700;
        font-size: 1.15rem;
        color: #141210;
      }
      .carton-cut {
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: lowercase;
        color: rgba(26, 20, 10, 0.78);
        background: none;
        border: 1px dashed rgba(26, 20, 10, 0.5);
        padding: 0.5rem 0.9rem;
        cursor: pointer;
      }
      .carton-cut:hover, .carton-cut:focus-visible { border-style: solid; color: #141210; outline: none; }
      .carton-note {
        font-size: 0.68rem;
        letter-spacing: 0.04em;
        color: rgba(26, 20, 10, 0.5);
        max-width: 30rem;
        text-align: center;
      }

      /* cutting: the tape splits and drops, the flaps lift, the box goes */
      .carton.cut .carton-tape { transform: scaleY(0.02); opacity: 0; }
      .carton.cut { transition: transform 0.7s 0.45s ease-in, opacity 0.6s 0.55s ease-in; transform: rotate(var(--lean)) translateY(1.5rem) scale(0.96); opacity: 0; }

      /* once it's open: what's left of it, flattened, at the top of the room */
      .carton-flat {
        position: relative;
        z-index: 41;
        margin: 0 0 2.2rem;
        padding: 0.5rem 0.8rem;
        width: fit-content;
        max-width: 100%;
        background: linear-gradient(180deg, #C79A66, #AE7F4C);
        font-family: 'Caveat', cursive;
        font-weight: 700;
        font-size: 1.2rem;
        color: #141210;
        transform: rotate(-0.8deg);
        box-shadow: 0 2px 3px rgba(40, 30, 18, 0.25);
      }
      .carton-flat small { font-family: 'Space Mono', monospace; font-weight: 400; font-size: 0.62rem; letter-spacing: 0.06em; color: rgba(20, 18, 16, 0.7); margin-left: 0.6rem; }
      html.packed .carton-flat { display: none; }

      /* the plan, with a box sitting in every room */
      .plan-box { fill: #B98B57; stroke: rgba(70, 45, 20, 0.8); stroke-width: 0.5; pointer-events: none; }
      .plan-box-tape { stroke: rgba(70, 45, 20, 0.8); stroke-width: 0.5; pointer-events: none; }

      html.match-out .carton { filter: brightness(0.55) drop-shadow(0 18px 14px rgba(0,0,0,0.4)); }
      @media (prefers-reduced-motion: reduce) {
        .carton.cut, .carton.cut .carton-tape { transition: none; }
      }
      @media print { .carton-wrap, .carton-flat { display: none !important; } html.packed main > .carton-contents { display: block !important; } }
    </style>
    <script>
    (function () {
      var labels = {
        front:        { room: 'FRONT ROOM', what: 'door. window. one sentence. the river stays', was: 'GULF COAST WINE & SPIRITS', up: 'THIS SIDE UP ↑', lean: '-1.4deg' },
        log:          { room: 'LOG', what: '14 days. that’s all that was left in there <span class="x">and the april stuff</span>', was: 'SPEC’S', up: 'FRAGILE (it forgets)', lean: '1.1deg' },
        guestbook:    { room: 'GUESTBOOK', what: 'everybody’s marks. not ours to leave', was: 'SPEC’S · 750ML × 12', up: 'KEEP DRY', lean: '-0.6deg' },
        transmission: { room: 'RADIO', what: 'still sending in there. don’t unplug it', was: 'TITO’S HANDMADE VODKA', up: 'THIS SIDE UP ↑ (antenna)', lean: '1.6deg' },
        witness:      { room: 'WITNESS', what: 'camera + every picture of the same room', was: 'CORONA EXTRA · 24/12 OZ', up: 'FRAGILE', lean: '-1.9deg' },
        ledger:       { room: 'LEDGER', what: 'receipts. all of them. <span class="x">toss</span> KEEP', was: 'SPEC’S', up: 'HEAVY', lean: '0.7deg' },
        still:        { room: 'STILL', what: 'quiet things. pack loose', was: 'LONE STAR · 24 CANS', up: 'DON’T STACK', lean: '-1deg' }
      };
      var order = ['front', 'guestbook', 'transmission', 'log', 'still', 'witness', 'ledger'];
      // the room name is set further down most pages than this include, so go by the address
      var room = location.pathname.replace(/^\/|\/$|\/index\.html$/g, '').split('/')[0] || 'front';
      if (!labels[room]) return;
      var root = document.documentElement;
      var key = 'packed-open:' + room;
      var open = false;
      try { open = sessionStorage.getItem(key) === '1'; } catch (e) {}

      function boxThePlan() {
        var svg = document.querySelector('.plan-svg');
        if (!svg) return;
        var ns = 'http://www.w3.org/2000/svg';
        // [x, y] of the box in each room, off to one side of the name
        var spots = { front: [96, 50], guestbook: [178, 50], transmission: [12, 110], witness: [64, 168], ledger: [12, 230], log: [97, 222], still: [182, 104] };
        Object.keys(spots).forEach(function (r) {
          if (r === room && open) return;
          var g = document.createElementNS(ns, 'g');
          g.setAttribute('aria-hidden', 'true');
          g.setAttribute('data-box', r);
          var x = spots[r][0], y = spots[r][1];
          var b = document.createElementNS(ns, 'rect');
          b.setAttribute('class', 'plan-box');
          b.setAttribute('x', x); b.setAttribute('y', y); b.setAttribute('width', 9); b.setAttribute('height', 7);
          var t = document.createElementNS(ns, 'path');
          t.setAttribute('class', 'plan-box-tape');
          t.setAttribute('d', 'M' + (x + 4.5) + ',' + y + ' V' + (y + 7));
          g.appendChild(b); g.appendChild(t);
          svg.appendChild(g);
        });
      }

      function pack() {
        var main = document.querySelector('main');
        if (!main) return;
        // a room that burned is char. you can't box ash, so it stays where it fell
        if (root.classList.contains('room-burned')) { boxThePlan(); return; }
        var inside = document.createElement('div');
        inside.className = 'carton-contents';
        while (main.firstChild) inside.appendChild(main.firstChild);
        main.appendChild(inside);

        var L = labels[room];
        var n = order.indexOf(room) + 1;
        var flat = document.createElement('p');
        flat.className = 'carton-flat';
        flat.innerHTML = L.room.toLowerCase() + ', unpacked <small>for the visit. close the tab and the movers tape it back up</small>';
        inside.insertBefore(flat, inside.firstChild);

        if (!open) {
          root.classList.add('packed');
          var wrap = document.createElement('div');
          wrap.className = 'carton-wrap';
          wrap.innerHTML =
            '<div class="carton" style="--lean:' + L.lean + '" role="img" aria-label="a moving box. ' + L.room.toLowerCase() + ': ' + L.what.replace(/<[^>]+>/g, '') + '">' +
              '<div class="carton-top"></div><div class="carton-tape"></div>' +
              '<div class="carton-front" data-was="' + L.was + '">' +
                '<span class="carton-stamp" aria-hidden="true">BOX CERTIFICATE<br>200 LB/IN²<br>18×18×16</span>' +
                '<p class="carton-label"><span class="room">' + L.room + '</span><span class="what">' + L.what + '</span><span class="up">' + L.up + '</span></p>' +
                '<span class="carton-count">' + n + ' of 7</span>' +
              '</div>' +
            '</div>' +
            '<button type="button" class="carton-cut" aria-expanded="false">cut the tape</button>' +
            '<p class="carton-note">sale pending. the whole room is in here, nothing thrown out. ' +
              'it’s the first time in a hundred and one nights you have to open something to read it.</p>';
          main.insertBefore(wrap, inside);
          var btn = wrap.querySelector('.carton-cut');
          btn.addEventListener('click', function () {
            btn.setAttribute('aria-expanded', 'true');
            btn.disabled = true;
            wrap.querySelector('.carton').classList.add('cut');
            try { sessionStorage.setItem(key, '1'); } catch (e) {}
            var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
            setTimeout(function () {
              root.classList.remove('packed');
              wrap.remove();
              var mine = document.querySelector('.plan-svg g[data-box="' + room + '"]');
              if (mine) mine.remove();
              // canvases and the like measured a room with nothing showing in it
              window.dispatchEvent(new Event('resize'));
              flat.setAttribute('tabindex', '-1');
              flat.focus({ preventScroll: true });
            }, reduce ? 0 : 1250);
          });
        }
        boxThePlan();
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pack);
      else pack();
    })();
    </script>
