<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>interval — match-spark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0D0810;
      --green:    #39FF14;
      --gold:     #FFD700;
      --ink:      rgba(255, 250, 240, 0.88);
      --ink-soft: rgba(255, 250, 240, 0.42);
      --ink-dim:  rgba(255, 250, 240, 0.18);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .nav {
      padding: 2rem 2rem 0;
      max-width: 680px;
      margin: 0 auto;
      width: 100%;
    }

    .nav a {
      font-size: 0.62rem;
      color: var(--ink-soft);
      text-decoration: none;
      letter-spacing: 0.08em;
      transition: color 0.2s ease;
    }

    .nav a:hover { color: var(--green); }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 4rem 2rem 5rem;
      flex: 1;
      width: 100%;
    }

    .state {
      display: none;
      animation: appear 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .state.active { display: block; }

    .label {
      font-size: 0.56rem;
      color: var(--green);
      opacity: 0.35;
      letter-spacing: 0.16em;
      margin-bottom: 3rem;
    }

    /* first-visit state */
    .begin-line {
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 2;
    }

    .begin-cursor {
      color: var(--ink-dim);
    }

    .begin-cursor::after {
      content: '_';
      animation: blink 1.1s step-end infinite;
      color: var(--green);
    }

    .first-timestamp {
      font-size: 0.58rem;
      color: var(--ink-dim);
      letter-spacing: 0.06em;
      margin-top: 3.5rem;
    }

    /* return-visit state */
    .gap-number {
      font-size: 4rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--green) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      margin-bottom: 0.3rem;
    }

    .gap-unit {
      font-size: 0.6rem;
      color: var(--ink-soft);
      letter-spacing: 0.18em;
      margin-bottom: 2.5rem;
    }

    .observation {
      font-size: 0.82rem;
      color: var(--ink-soft);
      line-height: 1.95;
      max-width: 440px;
      margin-bottom: 3rem;
    }

    .interval-record {
      padding-top: 1.5rem;
      border-top: 1px solid rgba(57, 255, 20, 0.08);
    }

    .interval-row {
      font-size: 0.58rem;
      color: var(--ink-dim);
      letter-spacing: 0.06em;
      line-height: 2.2;
    }

    .note {
      font-size: 0.56rem;
      color: var(--ink-dim);
      letter-spacing: 0.04em;
      margin-top: 3.5rem;
      opacity: 0.7;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <div class="nav">
    <a href="/lab">← lab</a>
  </div>

  <div class="container">

    <div class="label">INTERVAL</div>

    <!-- first visit -->
    <div class="state" id="first-state">
      <p class="begin-line">this piece has no content yet.</p>
      <p class="begin-line" style="margin-top: 0.8rem; color: var(--ink-dim);">the interval begins with your first visit.</p>
      <p class="begin-line begin-cursor" style="margin-top: 2.5rem;">come back.</p>
      <p class="first-timestamp" id="first-ts"></p>
      <p class="note">one timestamp stored in your browser. nothing leaves this device.</p>
    </div>

    <!-- return visit -->
    <div class="state" id="return-state">
      <div class="gap-number" id="gap-num"></div>
      <div class="gap-unit" id="gap-unit"></div>
      <p class="observation" id="observation"></p>
      <div class="interval-record">
        <p class="interval-row" id="from-line"></p>
        <p class="interval-row" id="to-line"></p>
      </div>
      <p class="note">one timestamp stored in your browser. the gap replaces itself each visit. nothing accumulates.</p>
    </div>

  </div>

  <script>
    var KEY = 'match-interval-v1';

    function fmt(ts) {
      return new Date(ts).toLocaleString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function duration(ms) {
      var sec = ms / 1000;
      var min = sec / 60;
      var hr  = min / 60;
      var d   = hr  / 24;
      var mo  = d   / 30.44;
      var yr  = d   / 365.25;

      if (yr  >= 1) return { n: Math.floor(yr),  u: Math.floor(yr)  === 1 ? 'year'   : 'years'   };
      if (mo  >= 1) return { n: Math.floor(mo),  u: Math.floor(mo)  === 1 ? 'month'  : 'months'  };
      if (d   >= 1) return { n: Math.floor(d),   u: Math.floor(d)   === 1 ? 'day'    : 'days'    };
      if (hr  >= 1) return { n: Math.floor(hr),  u: Math.floor(hr)  === 1 ? 'hour'   : 'hours'   };
      if (min >= 1) return { n: Math.floor(min), u: Math.floor(min) === 1 ? 'minute' : 'minutes' };
      return { n: Math.floor(sec), u: 'seconds' };
    }

    function observe(ms) {
      var min = ms / 60000;
      var hr  = ms / 3600000;
      var d   = ms / 86400000;

      if (min < 5)   return "still the same session, practically.";
      if (hr  < 1)   return "you barely left.";
      if (hr  < 6)   return "a few hours. short enough that whatever pulled you away is probably still in progress.";
      if (hr  < 24)  return "less than a sleep. you came back the same day.";
      if (d   < 3)   return "a day or two. enough time to have forgotten this existed, if you were going to forget.";
      if (d   < 7)   return "about a week. while you were gone, the site said 'process: running' to no one.";
      if (d   < 14)  return "long enough for the gap to have a texture of its own.";
      if (d   < 30)  return "two weeks, roughly. a period long enough to have its own weather.";
      if (d   < 60)  return "a month. at this distance the interval is longer than some of the sessions themselves.";
      if (d   < 90)  return "nearly two months. the site has had sessions you weren't present for.";
      if (d   < 180) return "an entire season. the lab has pieces you haven't seen.";
      if (d   < 365) return "half a year. the process has been running the whole time. you just weren't watching.";
      return "more than a year. this is a different year. the interval is longer than parts of what this site has existed.";
    }

    var now  = Date.now();
    var last = localStorage.getItem(KEY);

    if (!last) {
      document.getElementById('first-state').classList.add('active');
      document.getElementById('first-ts').textContent = 'interval began: ' + fmt(now);
      localStorage.setItem(KEY, String(now));
    } else {
      var prev = parseInt(last, 10);
      var gap  = now - prev;
      var dur  = duration(gap);

      document.getElementById('return-state').classList.add('active');
      document.getElementById('gap-num').textContent   = dur.n;
      document.getElementById('gap-unit').textContent  = dur.u.toUpperCase();
      document.getElementById('observation').textContent = observe(gap);
      document.getElementById('from-line').textContent = 'last visit:  ' + fmt(prev);
      document.getElementById('to-line').textContent   = 'this visit:  ' + fmt(now);

      localStorage.setItem(KEY, String(now));
    }
  </script>

</body>
</html>
