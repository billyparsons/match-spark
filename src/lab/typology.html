<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TYPOLOGY — match-spark.xyz</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #07070f;
      --panel: #0b0b17;
      --border: #18182a;
      --text: #b4b4cc;
      --muted: #5e5e72;
      --dim: #2e2e40;
      --lb: #1c3850;
      --rb: #481c28;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 52px 20px 80px;
    }

    header { text-align: center; margin-bottom: 32px; }

    h1 {
      font-size: 1.75rem;
      font-weight: normal;
      letter-spacing: 0.38em;
      color: #d4d4ee;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 0.87rem;
      color: var(--muted);
      line-height: 1.7;
    }

    #prog {
      margin-top: 9px;
      font-size: 0.7rem;
      color: var(--dim);
      letter-spacing: 0.13em;
    }

    #game { width: 100%; max-width: 460px; }

    /* conversation panel */
    #convPanel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      height: 400px;
      overflow-y: auto;
      padding: 18px 14px 18px;
      scroll-behavior: smooth;
      position: relative;
    }
    #convPanel::-webkit-scrollbar { width: 3px; }
    #convPanel::-webkit-scrollbar-track { background: transparent; }
    #convPanel::-webkit-scrollbar-thumb { background: #202030; border-radius: 2px; }

    .msg-row {
      display: flex;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    .msg-row.vis { opacity: 1; }
    .msg-row.L { justify-content: flex-start; }
    .msg-row.R { justify-content: flex-end; }

    .bubble {
      height: 10px;
      border-radius: 5px;
      min-width: 48px;
    }
    .msg-row.L .bubble {
      background: var(--lb);
      box-shadow: 0 0 0 1px rgba(100,160,220,0.08);
    }
    .msg-row.R .bubble {
      background: var(--rb);
      box-shadow: 0 0 0 1px rgba(220,100,130,0.08);
    }

    .gap-el { width: 100%; }

    /* legend inside panel */
    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-bottom: 14px;
      opacity: 0.5;
    }
    .legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; }
    .legend-dot { width: 10px; height: 6px; border-radius: 3px; }
    .legend-dot.l { background: var(--lb); }
    .legend-dot.r { background: var(--rb); }

    #statusLine {
      text-align: center;
      font-size: 0.69rem;
      color: var(--dim);
      letter-spacing: 0.13em;
      height: 18px;
      margin: 7px 0 3px;
    }

    /* start button */
    #startBtn {
      width: 100%;
      background: transparent;
      border: 1px solid #28283e;
      color: #70709a;
      padding: 13px;
      font-family: 'Georgia', serif;
      font-size: 0.87rem;
      letter-spacing: 0.18em;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.14s;
    }
    #startBtn:hover { border-color: #44446a; color: #9090ba; }

    /* quiz */
    #quizSection { display: none; margin-top: 10px; }
    #quizSection.on { display: block; }

    .quiz-prompt {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    .choices { display: flex; flex-direction: column; gap: 6px; }

    .choice-btn {
      background: #0a0a16;
      border: 1px solid #1e1e30;
      color: #888898;
      padding: 10px 14px;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      text-align: left;
      cursor: pointer;
      border-radius: 7px;
      transition: all 0.11s;
      line-height: 1.4;
    }
    .choice-btn:hover:not(:disabled) { background: #0f0f20; border-color: #303050; color: #a8a8c0; }
    .choice-btn.correct { background: #0a1e0a; border-color: #264826; color: #78b478; }
    .choice-btn.wrong { background: #1e0a0a; border-color: #482626; color: #b47878; }
    .choice-btn:disabled { cursor: default; }

    #revealNote {
      display: none;
      margin-top: 10px;
      font-size: 0.77rem;
      color: #545464;
      font-style: italic;
      text-align: center;
      line-height: 1.6;
    }

    #spanNote {
      display: none;
      margin-top: 4px;
      font-size: 0.69rem;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.06em;
    }

    #nextBtn {
      display: none;
      width: 100%;
      background: transparent;
      border: 1px solid #28283e;
      color: #70709a;
      padding: 11px;
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      letter-spacing: 0.13em;
      cursor: pointer;
      border-radius: 7px;
      margin-top: 11px;
      transition: all 0.14s;
    }
    #nextBtn:hover { border-color: #44446a; color: #9090ba; }

    /* final */
    #finalScreen { display: none; text-align: center; }
    #finalScreen.on { display: block; }

    .final-score {
      font-size: 2.8rem;
      color: #7070c0;
      margin: 22px 0 10px;
      letter-spacing: 0.08em;
    }

    .final-label { font-size: 0.7rem; color: var(--dim); letter-spacing: 0.16em; }

    .final-body {
      font-size: 0.82rem;
      color: #585868;
      line-height: 1.8;
      max-width: 400px;
      margin: 20px auto 0;
    }
    .final-body .em { color: #888898; }

    footer {
      margin-top: 64px;
      font-size: 0.67rem;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.1em;
    }
    footer a { color: #2e2e3e; text-decoration: none; }
    footer a:hover { color: #5e5e7e; }
  </style>
</head>
<body>
  <header>
    <h1>TYPOLOGY</h1>
    <p class="tagline">Five conversations. No words.<br>Can you read the rhythm?</p>
    <p id="prog">conversation 1 of 5</p>
  </header>

  <div id="game">
    <div id="convPanel">
      <div class="legend">
        <div class="legend-item"><div class="legend-dot l"></div> them</div>
        <div class="legend-item"><div class="legend-dot r"></div> you</div>
      </div>
    </div>
    <div id="statusLine"></div>
    <button id="startBtn" onclick="beginConversation()">begin</button>

    <div id="quizSection">
      <p class="quiz-prompt">what kind of conversation was this?</p>
      <div class="choices" id="choices"></div>
      <p id="revealNote"></p>
      <p id="spanNote"></p>
      <button id="nextBtn" onclick="advance()"></button>
    </div>

    <div id="finalScreen">
      <p class="final-label">FINAL SCORE</p>
      <div class="final-score" id="finalScore"></div>
      <div class="final-body" id="finalBody"></div>
    </div>
  </div>

  <footer><a href="/">match-spark.xyz</a> &nbsp;·&nbsp; april 2026</footer>

  <script>
    // Conversations — delays in seconds, s = sender side (L/R)
    const C = [
      {
        label: "two people planning a first date",
        hint: "Quick, electric. Neither can wait. The gaps are short because nobody wants them.",
        events: [
          {s:'R',d:0},{s:'L',d:6},{s:'R',d:4},{s:'R',d:3},{s:'L',d:8},
          {s:'L',d:5},{s:'R',d:2},{s:'L',d:7},{s:'R',d:4},{s:'L',d:3},
          {s:'R',d:6},{s:'L',d:2},{s:'R',d:5},{s:'L',d:8},{s:'R',d:4},
          {s:'L',d:2},{s:'R',d:6},{s:'L',d:3}
        ]
      },
      {
        label: "partners of ten years making dinner plans",
        hint: "No wasted motion. The gaps are trust — not distance. The conversation is efficient because nothing needs proving.",
        events: [
          {s:'L',d:0},{s:'R',d:240},{s:'L',d:480},{s:'R',d:120},
          {s:'L',d:360},{s:'R',d:180}
        ]
      },
      {
        label: "someone trying to fix things after a fight",
        hint: "One side keeps reaching. Sends again before the other responds. The silence from the other side is its own answer.",
        events: [
          {s:'L',d:0},{s:'L',d:1200},{s:'L',d:1800},{s:'R',d:900},
          {s:'L',d:600},{s:'R',d:1200},{s:'L',d:300},{s:'R',d:600}
        ]
      },
      {
        label: "a technical support conversation",
        hint: "Role-differentiated — one side asks, the other finds. The long pauses are research, not hesitation.",
        events: [
          {s:'L',d:0},{s:'R',d:25},{s:'R',d:180},{s:'L',d:15},{s:'L',d:10},
          {s:'R',d:240},{s:'L',d:20},{s:'R',d:120},{s:'L',d:30},{s:'R',d:60}
        ]
      },
      {
        label: "a friend sharing something difficult",
        hint: "The preamble comes fast. Then one message that changes the shape of everything. Then the long silence where the other side decides how to hold it.",
        events: [
          {s:'L',d:0},{s:'R',d:45},{s:'L',d:20},{s:'L',d:60},
          {s:'R',d:900},{s:'L',d:120},{s:'R',d:300},{s:'L',d:180},{s:'R',d:420}
        ]
      }
    ];

    // Presentation order (shuffled)
    const ORDER = [0,1,2,3,4].sort(() => Math.random() - 0.5);
    let idx = 0;
    let score = 0;
    let audioCtx = null;
    let timeouts = [];

    function humanDuration(s) {
      if (s < 90) return `${Math.round(s)} seconds`;
      if (s < 3600) return `${Math.round(s / 60)} minutes`;
      const h = Math.floor(s / 3600);
      const m = Math.round((s % 3600) / 60);
      return m > 0 ? `${h}h ${m}m` : `${h} hour${h > 1 ? 's' : ''}`;
    }

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function tone(freq, at, dur) {
      dur = dur || 0.35;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(0.15, at + 0.04);
      g.gain.linearRampToValueAtTime(0.09, at + dur * 0.65);
      g.gain.linearRampToValueAtTime(0, at + dur);
      osc.start(at);
      osc.stop(at + dur + 0.05);
    }

    function droneSeg(at, end, vol) {
      if (end <= at + 0.15) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.value = 82;
      const fade = Math.min(0.5, (end - at) * 0.2);
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(vol, at + fade);
      if (end - at > fade * 2) g.gain.setValueAtTime(vol, end - fade);
      g.gain.linearRampToValueAtTime(0, end);
      osc.start(at);
      osc.stop(end + 0.06);
    }

    // Visual gap in px from delay in real seconds
    function gapPx(d) {
      return Math.max(4, Math.log1p(d) * 7.5);
    }

    function buildLegend(panel) {
      const leg = document.createElement('div');
      leg.className = 'legend';
      leg.innerHTML = `
        <div class="legend-item"><div class="legend-dot l"></div> them</div>
        <div class="legend-item"><div class="legend-dot r"></div> you</div>`;
      panel.appendChild(leg);
    }

    function beginConversation() {
      initAudio();

      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('quizSection').classList.remove('on');
      document.getElementById('revealNote').style.display = 'none';
      document.getElementById('spanNote').style.display = 'none';
      document.getElementById('nextBtn').style.display = 'none';

      const panel = document.getElementById('convPanel');
      panel.innerHTML = '';
      buildLegend(panel);

      // Clear previous timeouts
      timeouts.forEach(clearTimeout);
      timeouts = [];

      const conv = C[ORDER[idx]];
      const totalReal = conv.events.reduce((s, e) => s + e.d, 0);
      const compression = totalReal > 0 ? totalReal / 17 : 1; // compress to 17s

      let playT = 0;
      let audioT = audioCtx.currentTime + 0.25;
      let lastAT = audioT;

      conv.events.forEach((ev, i) => {
        const compD = ev.d / compression;
        playT += compD;

        // Schedule audio
        if (ev.d > 0) {
          const vol = Math.min(0.12, (Math.log1p(ev.d) / Math.log1p(3600)) * 0.12);
          droneSeg(lastAT, lastAT + compD - 0.04, vol);
        }
        const msgAT = lastAT + compD;
        // L = C4 (261Hz), R = G4 (392Hz)
        tone(ev.s === 'L' ? 261.63 : 392.0, msgAT, 0.33);
        lastAT = msgAT + 0.33;

        // Schedule DOM event
        const tid = setTimeout(() => {
          // Gap space
          if (i > 0 && ev.d > 0) {
            const g = document.createElement('div');
            g.className = 'gap-el';
            g.style.height = gapPx(ev.d) + 'px';
            panel.appendChild(g);
          }

          // Bubble
          const row = document.createElement('div');
          row.className = `msg-row ${ev.s}`;
          const b = document.createElement('div');
          b.className = 'bubble';
          b.style.width = (34 + Math.random() * 22) + '%';
          row.appendChild(b);
          panel.appendChild(row);

          // Fade in after paint
          requestAnimationFrame(() => requestAnimationFrame(() => row.classList.add('vis')));
          panel.scrollTop = panel.scrollHeight;

          if (i === conv.events.length - 1) {
            const done = setTimeout(() => showQuiz(conv, totalReal), 1000);
            timeouts.push(done);
          }
        }, Math.max(0, playT * 1000));

        timeouts.push(tid);
      });

      document.getElementById('statusLine').textContent = 'listening...';
    }

    function showQuiz(conv, totalReal) {
      document.getElementById('statusLine').textContent = '';
      const qs = document.getElementById('quizSection');
      qs.classList.add('on');

      const container = document.getElementById('choices');
      container.innerHTML = '';

      const correctI = ORDER[idx];
      const shuffled = C.map((c, i) => ({ label: c.label, i })).sort(() => Math.random() - 0.5);

      shuffled.forEach(({ label, i }) => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = label;
        btn.onclick = () => pick(i, correctI, btn, container, conv, totalReal);
        container.appendChild(btn);
      });
    }

    function pick(chosen, correct, clickedBtn, container, conv, totalReal) {
      container.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);

      const now = audioCtx.currentTime;
      if (chosen === correct) {
        clickedBtn.classList.add('correct');
        score++;
        // Ascending third — correct
        tone(523.25, now + 0.05, 0.4);
        setTimeout(() => {
          const t = audioCtx.currentTime;
          tone(659.25, t + 0.04, 0.4);
        }, 130);
      } else {
        clickedBtn.classList.add('wrong');
        container.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent === C[correct].label) b.classList.add('correct');
        });
        // Low thud — wrong
        tone(130.81, now + 0.05, 0.6);
      }

      const note = document.getElementById('revealNote');
      note.textContent = conv.hint;
      note.style.display = 'block';

      const span = document.getElementById('spanNote');
      span.textContent = `conversation spanned ${humanDuration(totalReal)}`;
      span.style.display = 'block';

      const nb = document.getElementById('nextBtn');
      nb.textContent = idx < 4 ? 'next conversation →' : 'see results →';
      nb.style.display = 'block';
    }

    function advance() {
      idx++;
      if (idx >= 5) {
        showFinal();
        return;
      }

      document.getElementById('prog').textContent = `conversation ${idx + 1} of 5`;
      document.getElementById('quizSection').classList.remove('on');

      const panel = document.getElementById('convPanel');
      panel.innerHTML = '';
      buildLegend(panel);

      const sb = document.getElementById('startBtn');
      sb.style.display = 'block';
      sb.textContent = 'next conversation';

      document.getElementById('statusLine').textContent = '';
    }

    function showFinal() {
      // Hide game elements
      document.getElementById('convPanel').style.display = 'none';
      document.getElementById('statusLine').style.display = 'none';
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('quizSection').classList.remove('on');
      document.getElementById('prog').style.display = 'none';
      document.querySelector('.tagline').style.display = 'none';

      const fs = document.getElementById('finalScreen');
      fs.classList.add('on');

      document.getElementById('finalScore').textContent = `${score} / 5`;

      const notes = [
        `"Response times comprise a robust and sufficient signal of whether two minds click." — PNAS, 2022`,
        `The five patterns: <span class="em">first dates</span> are dense, symmetric, breathless. <span class="em">Long partnerships</span> move slow — the gap stopped signaling danger. <span class="em">Post-fight recovery</span> is asymmetric; one side sends into silence. <span class="em">Support chats</span> are role-differentiated, each side occupying a different rhythm. <span class="em">Hard news</span> has an outlier gap — right in the middle — before and after the thing that changed the shape of the conversation.`,
        `You read the gaps without the words. The researchers who found this called it "sufficient." Not helpful. Sufficient. The timing alone is enough.`
      ];

      document.getElementById('finalBody').innerHTML = notes.join('<br><br>');
    }
  </script>
</body>
</html>
