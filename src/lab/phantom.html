<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>phantom — match-spark</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --dot-color: rgba(230, 230, 230, 0.8);
  --text-dim: rgba(255,255,255,0.3);
  --text-mid: rgba(255,255,255,0.55);
  --text-bright: rgba(255,255,255,0.88);
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
}

body {
  background: #080808;
  font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── start screen ── */
#start-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2rem;
  transition: opacity 0.8s ease;
}

#start-screen .title {
  font-size: 0.65rem;
  letter-spacing: 0.25em;
  color: var(--text-dim);
  text-transform: uppercase;
}

#start-screen .subtitle {
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.18);
  max-width: 280px;
  text-align: center;
  line-height: 1.9;
}

#start-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.4);
  font-family: inherit;
  font-size: 0.65rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 0.65em 1.6em;
  cursor: pointer;
  transition: border-color 0.3s, color 0.3s;
  outline: none;
}

#start-btn:hover {
  border-color: rgba(255,255,255,0.4);
  color: rgba(255,255,255,0.7);
}

/* ── player ── */
#player {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 2.4rem;
}

#timestamp {
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 0.9s ease;
  user-select: none;
}

#dots-wrap {
  display: flex;
  gap: 7px;
  align-items: center;
  justify-content: center;
  height: 18px;
  opacity: 0;
  transition: opacity 0.35s ease;
}

.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--dot-color);
  animation: dot-pulse 0.85s ease-in-out infinite;
  animation-play-state: paused;
  will-change: transform, opacity;
}
.dot:nth-child(2) { animation-delay: 0.22s; }
.dot:nth-child(3) { animation-delay: 0.44s; }
.dot.live { animation-play-state: running; }

@keyframes dot-pulse {
  0%, 100% { transform: scale(0.5); opacity: 0.4; }
  50%       { transform: scale(1.05); opacity: 0.92; }
}

#counter {
  font-size: 0.55rem;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 0.5s ease;
  user-select: none;
}

/* ── reveal ── */
#reveal {
  display: none;
  flex-direction: column;
  max-width: 380px;
  width: 88vw;
  opacity: 0;
  transition: opacity 1.2s ease;
}

.r-line {
  font-size: 0.72rem;
  letter-spacing: 0.05em;
  line-height: 2;
  color: var(--text-mid);
  opacity: 0;
  transition: opacity 1.1s ease;
}

.r-line.accent {
  color: var(--text-bright);
  font-size: 0.8rem;
  margin-top: 0.2rem;
}

.r-sep {
  width: 1px;
  height: 2.2rem;
  background: rgba(255,255,255,0.1);
  margin: 1.4rem 0;
  opacity: 0;
  transition: opacity 1s ease;
}

/* ── attribution ── */
#attr {
  position: fixed;
  bottom: 1.4rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.55rem;
  letter-spacing: 0.1em;
  color: rgba(255,255,255,0.1);
  opacity: 0;
  transition: opacity 2s ease;
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="start-screen">
  <div class="title">phantom</div>
  <div class="subtitle">five typing indicators<br>none of them arrived</div>
  <button id="start-btn">watch</button>
</div>

<div id="player">
  <div id="timestamp"></div>
  <div id="dots-wrap">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <div id="counter"></div>
</div>

<div id="reveal">
  <div class="r-line" id="r1"></div>
  <div class="r-sep"  id="rs1"></div>
  <div class="r-line" id="r2"></div>
  <div class="r-line" id="r3"></div>
  <div class="r-sep"  id="rs2"></div>
  <div class="r-line accent" id="r4"></div>
</div>

<div id="attr">match-spark.xyz — 2026</div>

<script>
// ── pattern definitions ──────────────────────────────────────────────────
// Each segment: { on: bool, ms: duration }
// pitch: ambient tone frequency (Hz) during this pattern
// variability: how erratic the dot timing is (0 = metronomic, 1 = chaotic)

const PATTERNS = [
  {
    ts: "3:17 am",
    pitch: 190,
    variability: 0.35,
    segs: [
      { on: true,  ms: 4300 },
      { on: false, ms: 3100 },
      { on: true,  ms: 6200 },
      { on: false, ms: 4400 },
      { on: true,  ms: 2400 },
    ]
  },
  {
    ts: "11:08 pm",
    pitch: 430,
    variability: 0.42,
    segs: [
      { on: true,  ms: 880  },
      { on: false, ms: 260  },
      { on: true,  ms: 720  },
      { on: false, ms: 200  },
      { on: true,  ms: 1050 },
      { on: false, ms: 460  },
      { on: true,  ms: 1900 },
    ]
  },
  {
    ts: "9:03 am",
    pitch: 270,
    variability: 0.13,
    segs: [
      { on: true,  ms: 3200 },
      { on: false, ms: 920  },
      { on: true,  ms: 4300 },
      { on: false, ms: 860  },
      { on: true,  ms: 3100 },
    ]
  },
  {
    ts: "2:41 pm",
    pitch: 215,
    variability: 0.27,
    segs: [
      { on: true,  ms: 2100 },
      { on: false, ms: 8600 },   // long gap — walked away
      { on: true,  ms: 1600 },
      { on: false, ms: 540  },
      { on: true,  ms: 2100 },
    ]
  },
  {
    ts: "6:52 pm",
    pitch: 315,
    variability: 0.0,            // metronomic — perfectly even
    segs: [
      { on: true,  ms: 2800 },
      { on: false, ms: 1000 },
      { on: true,  ms: 2800 },
      { on: false, ms: 1000 },
      { on: true,  ms: 2800 },
    ]
  },
];

const totalMs = PATTERNS.reduce((s,p) => s + p.segs.reduce((a,sg) => a+sg.ms, 0), 0);
const totalSec = Math.round(totalMs / 1000);

// ── DOM refs ─────────────────────────────────────────────────────────────
const startScreen = document.getElementById('start-screen');
const startBtn    = document.getElementById('start-btn');
const playerEl    = document.getElementById('player');
const tsEl        = document.getElementById('timestamp');
const dotsWrap    = document.getElementById('dots-wrap');
const dots        = document.querySelectorAll('.dot');
const counterEl   = document.getElementById('counter');
const revealEl    = document.getElementById('reveal');
const attrEl      = document.getElementById('attr');

// ── audio ────────────────────────────────────────────────────────────────
let actx;

function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
}

// Persistent low drone throughout
function startDrone() {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.value = 52;
  gain.gain.setValueAtTime(0, actx.currentTime);
  gain.gain.linearRampToValueAtTime(0.035, actx.currentTime + 4);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start();
  return gain;
}

// Presence tone fades in/out per active segment
function createPresenceTone(freq) {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  const filt = actx.createBiquadFilter();
  osc.type = 'sine';
  osc.frequency.value = freq;
  filt.type = 'lowpass';
  filt.frequency.value = freq * 2.5;
  gain.gain.setValueAtTime(0, actx.currentTime);
  osc.connect(filt); filt.connect(gain); gain.connect(actx.destination);
  osc.start();
  return {
    on()  { gain.gain.linearRampToValueAtTime(0.07, actx.currentTime + 0.5); },
    off() { gain.gain.linearRampToValueAtTime(0,    actx.currentTime + 0.7); },
    stop(){ setTimeout(()=>osc.stop(), 900); }
  };
}

// Soft click on dot appear/disappear
function click(freq = 280) {
  const osc  = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.06, actx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.08);
  osc.connect(gain); gain.connect(actx.destination);
  osc.start(); osc.stop(actx.currentTime + 0.1);
}

// ── dot control ──────────────────────────────────────────────────────────
function setDotVariability(v) {
  const base = 850;
  dots.forEach((d, i) => {
    const jitter = v === 0 ? 0 : (Math.random() * 2 - 1) * v * 180;
    d.style.animationDuration = `${base + jitter}ms`;
  });
}

// ── utilities ────────────────────────────────────────────────────────────
const wait = ms => new Promise(r => setTimeout(r, ms));

async function fadeIn(el, durationMs = 800) {
  el.style.transition = `opacity ${durationMs}ms ease`;
  el.style.opacity = '1';
  await wait(durationMs);
}

async function fadeOut(el, durationMs = 600) {
  el.style.transition = `opacity ${durationMs}ms ease`;
  el.style.opacity = '0';
  await wait(durationMs);
}

// ── run one pattern ──────────────────────────────────────────────────────
async function runPattern(p, idx) {
  // show counter
  counterEl.textContent = `${idx + 1} / ${PATTERNS.length}`;
  await fadeIn(counterEl, 500);

  // show timestamp
  tsEl.textContent = p.ts;
  await fadeIn(tsEl, 900);
  await wait(300);

  const tone = createPresenceTone(p.pitch);
  setDotVariability(p.variability);

  for (const seg of p.segs) {
    if (seg.on) {
      click(p.pitch * 0.8);
      dotsWrap.style.opacity = '1';
      dots.forEach(d => d.classList.add('live'));
      tone.on();
      await wait(seg.ms);
    } else {
      dotsWrap.style.opacity = '0';
      dots.forEach(d => d.classList.remove('live'));
      tone.off();
      // re-randomize variability on each restart
      await wait(100);
      setDotVariability(p.variability);
      await wait(seg.ms - 100);
    }
  }

  // end of pattern — dots disappear, no message
  dotsWrap.style.opacity = '0';
  dots.forEach(d => d.classList.remove('live'));
  tone.off();
  tone.stop();
  click(p.pitch * 0.5);

  await wait(700);
  await fadeOut(tsEl, 700);
  await fadeOut(counterEl, 500);
  await wait(1800); // silence between patterns
}

// ── reveal sequence ──────────────────────────────────────────────────────
async function runReveal(droneGain) {
  // swell drone slightly for the reveal
  droneGain.gain.linearRampToValueAtTime(0.055, actx.currentTime + 3);

  playerEl.style.display = 'none';
  revealEl.style.display = 'flex';
  await wait(50);
  await fadeIn(revealEl, 1200);

  document.getElementById('r1').textContent =
    `these five indicators played for ${totalSec} seconds.`;
  await fadeIn(document.getElementById('r1'), 1000);
  await wait(1400);

  await fadeIn(document.getElementById('rs1'), 900);
  await wait(400);

  document.getElementById('r2').textContent =
    'iMessage fires the typing indicator when a keyboard is opened.';
  await fadeIn(document.getElementById('r2'), 1000);
  await wait(700);

  document.getElementById('r3').textContent =
    'not when a character is typed.';
  await fadeIn(document.getElementById('r3'), 1000);
  await wait(1800);

  await fadeIn(document.getElementById('rs2'), 900);
  await wait(600);

  document.getElementById('r4').textContent =
    'one of them had no one.';
  await fadeIn(document.getElementById('r4'), 1400);

  // attribution fades in last
  await wait(2000);
  await fadeIn(attrEl, 2000);

  // slowly fade drone
  droneGain.gain.linearRampToValueAtTime(0, actx.currentTime + 8);
}

// ── main ─────────────────────────────────────────────────────────────────
startBtn.addEventListener('click', async () => {
  initAudio();

  await fadeOut(startScreen, 600);
  startScreen.style.display = 'none';

  playerEl.style.display = 'flex';
  await wait(50);

  const droneGain = startDrone();

  await wait(1200); // opening silence

  for (let i = 0; i < PATTERNS.length; i++) {
    await runPattern(PATTERNS[i], i);
  }

  await wait(1000);
  await runReveal(droneGain);
});
</script>
</body>
</html>
