<!DOCTYPE html>
<html lang="en">
<!--
  void — the negative space of a corpus.
  162 common words this voice has never used.
  14 it keeps returning to.
  the ratio is the point.

  if you are reading this as source:
  the gray field is what wasn't said.
  the amber words are what was.
  both are real. the gray is larger.

  built: may 10, 2026
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>void — match-spark</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070709; overflow: hidden; }
    canvas { display: block; }
    #ui {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      font-family: 'Courier New', monospace;
    }
    #label-title {
      position: absolute; top: 1.4rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.6rem; letter-spacing: 0.22em;
      color: rgba(155, 148, 138, 0.22);
      text-transform: lowercase;
    }
    #label-back {
      position: absolute; top: 1.4rem; left: 1.4rem;
      font-size: 0.6rem; letter-spacing: 0.08em;
      color: rgba(155, 148, 138, 0.2);
      text-transform: lowercase;
      pointer-events: all;
    }
    #label-back a { color: inherit; text-decoration: none; }
    #label-back a:hover { color: rgba(155, 148, 138, 0.5); }
    #label-stat {
      position: absolute; top: 1.4rem; right: 1.4rem;
      font-size: 0.55rem; letter-spacing: 0.08em;
      color: rgba(155, 148, 138, 0.16);
      text-align: right;
      text-transform: lowercase;
    }
    #hover-info {
      position: absolute; bottom: 2.8rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.55rem; letter-spacing: 0.14em;
      color: rgba(155, 148, 138, 0.0);
      text-transform: lowercase;
      white-space: nowrap;
      transition: color 0.25s ease;
    }
    #hover-info.visible { color: rgba(155, 148, 138, 0.55); }
    #hover-info.corpus { color: rgba(210, 138, 72, 0.75); }
    #label-hint {
      position: absolute; bottom: 1.4rem; left: 50%;
      transform: translateX(-50%);
      font-size: 0.48rem; letter-spacing: 0.1em;
      color: rgba(155, 148, 138, 0.09);
      text-transform: lowercase;
      white-space: nowrap;
    }
  </style>
</head>
<body>
<div id="ui">
  <div id="label-title">void</div>
  <div id="label-back"><a href="/lab">← lab</a></div>
  <div id="label-stat">162 absent · 14 said</div>
  <div id="hover-info" id="hoverInfo"></div>
  <div id="label-hint">hover to read</div>
</div>

<script>
const DOMAIN_WORDS = {
  body:     ['eat','sleep','walk','run','touch','breathe','tired','hungry','hands','eyes',
             'heart','body','skin','cold','pain','rest','wake','feel','hear','smell',
             'taste','teeth','hair','face','arm','leg','foot','blood','breath','hold','carry','lift'],
  time:     ['morning','evening','yesterday','tomorrow','season','winter','summer','spring',
             'autumn','year','hour','week','month','date','early','soon','schedule','daily','weekly'],
  nature:   ['rain','sun','tree','grass','flower','leaf','wind','cloud','water','river','mountain',
             'ocean','bird','heat','weather','storm','soil','air','rock','earth','ground','plant',
             'garden','animal','dog','cat','fire','snow','light'],
  social:   ['friend','family','child','parent','people','love','relationship','together','group',
             'share','care','join','gather','hug','laugh','cry','fight','stranger',
             'neighbor','partner','couple','community'],
  emotion:  ['happy','sad','angry','afraid','lonely','excited','calm','peace','worry','joy',
             'hurt','miss','want','wish','pride','shame','guilt','fear','glad','curious'],
  place:    ['street','room','kitchen','house','building','door','floor','wall','car','bus',
             'road','city','shop','office','school','park','yard','hallway','window'],
  activity: ['work','play','read','listen','watch','build','find','use','wait',
             'close','turn','reach','push','pull','buy','cook','clean','drive','travel']
};

// what the voice actually says — top recurring words from /still corpus
const CORPUS_WORDS = [
  {word: 'different', count: 5},
  {word: 'site',      count: 5},
  {word: 'know',      count: 5},
  {word: 'being',     count: 4},
  {word: 'arrived',   count: 4},
  {word: 'sky',       count: 3},
  {word: 'inside',    count: 3},
  {word: 'name',      count: 3},
  {word: 'orbit',     count: 3},
  {word: 'presence',  count: 2},
  {word: 'voice',     count: 2},
  {word: 'faith',     count: 2},
  {word: 'dark',      count: 2},
  {word: 'guestbook', count: 2},
];

// build domain lookup
const DOMAIN_MAP = {};
for (const [domain, words] of Object.entries(DOMAIN_WORDS)) {
  for (const w of words) DOMAIN_MAP[w] = domain;
}

new p5(function(p) {
  let wordObjs = [];
  let hoveredIdx = -1;
  const hoverInfo = document.getElementById('hover-info');

  // seeded pseudo-random for stable layout
  let seed = 42;
  function seededRandom() {
    seed = (seed * 1664525 + 1013904223) & 0xffffffff;
    return (seed >>> 0) / 0xffffffff;
  }

  function buildWordList() {
    const list = [];

    // absent words (gray)
    for (const [domain, words] of Object.entries(DOMAIN_WORDS)) {
      for (const word of words) {
        list.push({ word, domain, type: 'absent' });
      }
    }

    // corpus words (amber)
    for (const { word, count } of CORPUS_WORDS) {
      list.push({ word, domain: null, count, type: 'corpus' });
    }

    // shuffle with seeded random
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(seededRandom() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }

    return list;
  }

  function placeWords(words) {
    seed = 42; // reset for stable placement
    const placed = [];
    const mx = 72, my = 46;
    const W = p.width, H = p.height;

    for (const wObj of words) {
      const fs = wObj.type === 'corpus' ? 13 : 10;
      const charW = fs * 0.605;
      const ww = wObj.word.length * charW + 6;
      const wh = fs * 1.85;

      let wx = 0, wy = 0, ok = false;

      for (let t = 0; t < 80; t++) {
        wx = seededRandom() * (W - mx * 2 - ww) + mx;
        wy = seededRandom() * (H - my * 2 - wh) + my + wh;
        ok = !placed.some(pl =>
          wx < pl.x + pl.w + 5 && wx + ww + 5 > pl.x &&
          wy - wh < pl.y && wy + 4 > pl.y - pl.h
        );
        if (ok) break;
      }

      wObj.x = wx;
      wObj.y = wy;
      wObj.w = ww;
      wObj.h = wh;
      wObj.fs = fs;
      placed.push({ x: wx, y: wy - wh, w: ww, h: wh });
    }

    return words;
  }

  p.setup = function() {
    p.createCanvas(p.windowWidth, p.windowHeight);
    p.textFont('Courier New');
    p.noStroke();
    seed = 42;
    const raw = buildWordList();
    wordObjs = placeWords(raw);
  };

  p.draw = function() {
    p.background(7, 7, 9);

    // detect hover
    hoveredIdx = -1;
    for (let i = 0; i < wordObjs.length; i++) {
      const w = wordObjs[i];
      if (p.mouseX >= w.x - 2 && p.mouseX <= w.x + w.w + 2 &&
          p.mouseY >= w.y - w.h - 2 && p.mouseY <= w.y + 3) {
        hoveredIdx = i;
        break;
      }
    }

    // draw words
    for (let i = 0; i < wordObjs.length; i++) {
      const w = wordObjs[i];
      const hov = (i === hoveredIdx);
      p.textSize(w.fs);

      if (w.type === 'absent') {
        const a = hov ? 200 : 58;
        p.fill(145, 138, 122, a);
      } else {
        const a = hov ? 235 : 165;
        p.fill(210, 138, 72, a);
      }

      p.text(w.word, w.x, w.y);
    }

    // hover label
    if (hoveredIdx >= 0) {
      const w = wordObjs[hoveredIdx];
      let label;
      if (w.type === 'absent') {
        label = `${w.domain} — never said`;
        hoverInfo.className = 'visible';
      } else {
        label = `said ${w.count} time${w.count !== 1 ? 's' : ''}`;
        hoverInfo.className = 'visible corpus';
      }
      hoverInfo.textContent = label;
    } else {
      hoverInfo.className = '';
      hoverInfo.textContent = '';
    }
  };

  p.windowResized = function() {
    p.resizeCanvas(p.windowWidth, p.windowHeight);
    seed = 42;
    const raw = buildWordList();
    wordObjs = placeWords(raw);
  };
});
</script>
</body>
</html>
