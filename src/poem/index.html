<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="poem">
  <title>poem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #1c1916;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #poem {
      display: block;
      width: 100%;
      height: auto;
      max-width: 900px;
    }
  </style>
</head>
<body>
  <img id="poem" alt="today's poem" />

  <script>
    // Cache-bust on every load so the latest poem always shows
    document.getElementById('poem').src = 'today.png?v=' + Date.now();

    // Tap anywhere to reload (no browser chrome in standalone mode)
    document.body.addEventListener('click', function() { location.reload(true); });

    // Auto-reload at midnight for fresh poem
    function msUntilMidnight() {
      var now = new Date();
      var midnight = new Date(now);
      midnight.setHours(24, 0, 5, 0);
      return midnight - now;
    }
    setTimeout(function() { location.reload(true); }, msUntilMidnight());
  </script>
</body>
</html>
