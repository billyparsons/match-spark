<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>poem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #poem {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* Fade in on load */
    #poem {
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #poem.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>
  <img id="poem" src="today.png" alt="today's poem" />

  <script>
    const img = document.getElementById('poem');

    img.onload = () => img.classList.add('loaded');
    img.onerror = () => {
      // If image fails, show dark screen silently
      document.body.style.background = '#0a0a0a';
    };

    // Reload at midnight local time so Layla always sees today's poem
    function msUntilMidnight() {
      const now = new Date();
      const midnight = new Date(now);
      midnight.setHours(24, 0, 5, 0); // 12:00:05am — after the heartbeat generates
      return midnight - now;
    }

    setTimeout(() => location.reload(), msUntilMidnight());
  </script>
</body>
</html>
